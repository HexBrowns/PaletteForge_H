[package]
name = "palette-forge-h"
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["HexBrowns"]
description = "PaletteForge_H - role based palette generator for AviUtl2"
publish = false

[lib]
name = "palette_forge_h"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
aviutl2 = { version = "0.45", features = ["generic", "serde"] }
aviutl2-eframe = "0.45"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
